name: Compile CV

on:
  push:
    branches:
      - main
    paths:
      - "src/cv/**"
  pull_request:
    branches:
      - main
    paths:
      - "src/cv/**"
  workflow_dispatch:

jobs:
  compile:
    name: Compile LaTeX CV
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache tectonic packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/Tectonic
          key: tectonic-packages-v1
          restore-keys: |
            tectonic-packages-

      - name: Install tectonic
        # pinned to v3.0.0 commit SHA — verify at https://github.com/wtfjoke/setup-tectonic
        uses: wtfjoke/setup-tectonic@5b42571c4f9d4e74c3fa544cb5f71b81b9f02d2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile CV
        run: tectonic src/cv/AmrMahmoudCV.tex --outdir public/

      - name: Commit compiled PDF
        # Only commit on push to main, not on PRs
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        # pinned to v5.0.0 commit SHA — verify at https://github.com/stefanzwi/git-auto-commit-action
        uses: stefanzwi/git-auto-commit-action@8234e24a3b9efa7e48c4c9f1f5e91a03c3fcdb0
        with:
          commit_message: "ci: compile CV [skip ci]"
          file_pattern: "public/AmrMahmoudCV.pdf"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"

      - name: Upload PDF artifact (for PRs)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: AmrMahmoudCV
          path: public/AmrMahmoudCV.pdf
          retention-days: 7
