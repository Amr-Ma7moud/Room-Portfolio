name: Compile CV

on:
  push:
    branches:
      - main
    paths:
      - "src/cv/**"
  pull_request:
    branches:
      - main
    paths:
      - "src/cv/**"
  workflow_dispatch:

jobs:
  compile:
    name: Compile LaTeX CV
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache tectonic packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/Tectonic
          key: tectonic-packages-v1
          restore-keys: |
            tectonic-packages-

      - name: Install tectonic
        # pinned to v3 tag SHA — verified via git ls-remote
        uses: wtfjoke/setup-tectonic@8a63d072f8390efdff59da7fa08aa49e3c1f5e1b
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile CV
        run: tectonic src/cv/AmrMahmoudCV.tex --outdir public/

      - name: Commit compiled PDF
        # Only commit on push to main, not on PRs
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        # pinned to v5 tag SHA — verified via git ls-remote
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403
        with:
          commit_message: "ci: compile CV [skip ci]"
          file_pattern: "public/AmrMahmoudCV.pdf"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"

      - name: Upload PDF artifact (for PRs)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: AmrMahmoudCV
          path: public/AmrMahmoudCV.pdf
          retention-days: 7
